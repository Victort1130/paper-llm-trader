[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrader"
version = "0.1.0"
description = "Paper-money-only LLM trading agent research harness (no live trading)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Only needed to download historical data once (scripts/fetch_data.py).
data = ["yfinance>=0.2.40"]
# Only needed for the real LLM strategy. Tests never call the API.
llm = ["anthropic>=2.14"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papertrader = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
